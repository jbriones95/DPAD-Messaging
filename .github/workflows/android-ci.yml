name: Android CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish"
        required: false
        type: string
      experimental_build:
        description: "Publish an experimental build from the selected branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pr-quality-gates:
    runs-on: ubuntu-latest
    env:
      DUMBER_RUST_TOOLCHAIN: "1.96.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Test dumber.chat native core
        run: rustup run "$DUMBER_RUST_TOOLCHAIN" cargo test --locked --manifest-path vendor/dumber-chat-core/Cargo.toml

      - name: Check dumber.chat native formatting
        run: rustup run "$DUMBER_RUST_TOOLCHAIN" cargo fmt --all --manifest-path vendor/dumber-chat-core/Cargo.toml -- --check

      - name: Lint dumber.chat native core
        run: rustup run "$DUMBER_RUST_TOOLCHAIN" cargo clippy --locked --manifest-path vendor/dumber-chat-core/Cargo.toml --all-targets -- -D warnings

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            ndk;30.0.16248370

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Lint (baseline enforced)
        run: ./gradlew lintDebug

      - name: Unit smoke tests (SMS/MMS/scheduled)
        run: ./gradlew testDebugUnitTest

      - name: Verify Room migrations (schema + migration test compile)
        run: ./gradlew :app:assembleDebugAndroidTest

  trusted-signed-release-gate:
    runs-on: ubuntu-latest
    needs: pr-quality-gates
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    permissions:
      contents: write
    env:
      DUMBER_RUST_TOOLCHAIN: "1.96.0"
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - name: Test dumber.chat native core
        run: rustup run "$DUMBER_RUST_TOOLCHAIN" cargo test --locked --manifest-path vendor/dumber-chat-core/Cargo.toml

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            ndk;30.0.16248370

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_STORE_FILE }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
        shell: bash

      - name: Build release (signed gate)
        run: ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: "${{ runner.temp }}/release.jks"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: com.dpadsms_release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk

  experimental-release:
    runs-on: ubuntu-latest
    needs: pr-quality-gates
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.experimental_build == true)
    permissions:
      contents: write
    env:
      DUMBER_RUST_TOOLCHAIN: "1.96.0"
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            ndk;30.0.16248370

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set experimental version code
        run: echo "EXPERIMENTAL_VERSION_CODE=$((1058000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_STORE_FILE }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
        shell: bash

      - name: Build signed experimental APK
        run: ./gradlew assembleExperimental
        env:
          RELEASE_STORE_FILE: "${{ runner.temp }}/release.jks"

      - name: Name experimental APK
        run: cp app/build/outputs/apk/experimental/app-experimental.apk "app-experimental-${EXPERIMENTAL_VERSION_CODE}.apk"

      - name: Publish experimental prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental
          name: Experimental build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app-experimental-${{ env.EXPERIMENTAL_VERSION_CODE }}.apk
